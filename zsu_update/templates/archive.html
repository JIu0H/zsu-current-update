<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Завантажити архів оновлення</title>
<style>
  html,body{margin:0;min-height:100%;background:#0d0d0d;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:520px;padding:32px 20px}
  h1{font-size:22px;margin:0 0 12px;color:#FFBD1B}
  p{color:#b0b0b0;line-height:1.5}
  button,.btn{
    display:inline-block;margin-top:18px;background:#FFBD1B;color:#111;border:0;
    font-weight:800;font-size:16px;padding:14px 22px;cursor:pointer;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Архів оновлення</h1>
    <p>Натисніть кнопку, щоб зберегти файл <b>zsu-current-update.zip</b>.</p>
    <button type="button" data-zip-download>Завантажити ZIP</button>
    <p><a class="btn" href="/static/zsu-update.zip" download="zsu-current-update.zip">Пряме посилання</a></p>
    <p><a href="/" style="color:#FFBD1B">← На головну</a></p>
  </div>
  <script src="{{ url_for('static', filename='zip-download.js') }}"></script>
  <script>window.addEventListener('load', function(){ if (window.downloadZsuZip) downloadZsuZip(); });</script>
</body>
</html>
